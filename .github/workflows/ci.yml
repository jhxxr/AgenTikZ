name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit or ref to verify when called by the release workflow.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  tests:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Linux system dependencies (WebKitGTK for Tauri v2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests (Vitest)
        run: npm test

      - name: Build frontend production bundle (TypeScript + Vite)
        run: npm run build

      - name: Stage bundled ACP adapters
        run: npm run adapters:stage

      - name: Run Tauri Rust backend unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
