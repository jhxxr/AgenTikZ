name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit or ref to verify when called by the release workflow.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  tests:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Linux system dependencies (WebKitGTK for Tauri v2)
        if: runner.os == 'Linux'
        run: |
          # Hosted runners may point at an unreachable Azure mirror. Prefer the
          # official HTTPS archive and bound retries rather than hanging on DNS.
          for sources in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$sources" ]; then
              sudo sed -i 's|http[s]*://azure.archive.ubuntu.com/ubuntu/*|https://archive.ubuntu.com/ubuntu/|g' "$sources"
            fi
          done
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            crates/agentikz-mcp -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests (Vitest)
        run: npm test

      - name: Test adapter packaging guards and isolated bundles
        run: npm run test:packaging

      - name: Stress persistence test isolation
        run: node scripts/test-persistence-isolation.mjs

      - name: Build frontend production bundle (TypeScript + Vite)
        run: npm run build

      - name: Stage bundled ACP adapters
        run: npm run adapters:stage

      - name: Stage and verify native MCP transport
        run: |
          npm run mcp:stage
          npm run test:mcp

      - name: Stage bundled TeX engine, fonts, packages and official paper templates
        run: npm run tex:stage

      - name: Run Tauri Rust backend unit tests
        # Tauri embeds the staged runtime as an application resource.
        run: |
          npm run pi:stage
          npm run test:pi
          cargo test --manifest-path src-tauri/Cargo.toml
