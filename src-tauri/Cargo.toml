[package]
name = "agentikz"
version = "0.3.0"
description = "AI-era Visual TikZ & PGFPlots Editor for Scientific Research with BYOA (ACP/MCP)"
authors = ["AgenTikZ"]
license = "MIT"
repository = "https://github.com/jhxxr/AgenTikZ"
edition = "2021"

[lib]
name = "agentikz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "io-std", "time", "rt-multi-thread", "macros", "sync"] }
agent-client-protocol = { version = "5.0", features = ["process"] }
