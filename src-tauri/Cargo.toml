[package]
name = "agentikz"
version = "0.8.0"
description = "AI-era Visual TikZ & PGFPlots Editor for Scientific Research with BYOA (ACP/MCP)"
authors = ["AgenTikZ"]
license = "MIT"
repository = "https://github.com/jhxxr/AgenTikZ"
edition = "2021"

[lib]
name = "agentikz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "io-std", "time", "rt-multi-thread", "macros", "sync"] }
agent-client-protocol = { version = "5.0", features = ["process"] }
agentikz-mcp = { path = "../crates/agentikz-mcp" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
uuid = { version = "1", features = ["v4"] }
hayro-svg = "0.9"
flate2 = "1"
keyring = { version = "=3.6.3", features = ["windows-native", "apple-native", "linux-native-async-persistent", "tokio", "crypto-rust"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
